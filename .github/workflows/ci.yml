name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Check searchkernel import boundary
        run: uv run python scripts/check_public_searchkernel_imports.py

      - name: Run architecture boundary tests
        run: uv run pytest -q -n 0 tests/unit/test_searchkernel_import_boundary.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run pyright
        run: uv run pyright

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      HF_HOME: /home/runner/.cache/huggingface
      LLAMA_INDEX_CACHE_DIR: /home/runner/.cache/llama_index
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TQDM_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/llama_index
          key: >-
            test-models-${{ runner.os }}-${{
            hashFiles('uv.lock', 'pyproject.toml',
            'scripts/download_test_models.py', 'tests/conftest.py') }}

      - name: Pre-download test models
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: uv run python scripts/download_test_models.py

      - name: Verify test models offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          if ! uv run python scripts/download_test_models.py; then
            echo "::error::Required test models are unavailable."
            echo "::error::Check both model caches."
            exit 1
          fi

      - name: Run pytest with coverage
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          uv run pytest -m "not performance"
          --cov=mcp_markdown_ragdocs --cov-report=xml --cov-report=term-missing
          --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  performance:
    name: Performance Benchmarks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      HF_HOME: /home/runner/.cache/huggingface
      LLAMA_INDEX_CACHE_DIR: /home/runner/.cache/llama_index
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TQDM_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/llama_index
          key: >-
            test-models-${{ runner.os }}-${{
            hashFiles('uv.lock', 'pyproject.toml',
            'scripts/download_test_models.py', 'tests/conftest.py') }}

      - name: Pre-download test models
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: uv run python scripts/download_test_models.py

      - name: Verify test models offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          if ! uv run python scripts/download_test_models.py; then
            echo "::error::Required test models are unavailable."
            echo "::error::Check both model caches."
            exit 1
          fi

      - name: Run performance tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest -m performance -n 0
