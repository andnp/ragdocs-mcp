[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-markdown-ragdocs"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for semantic search over Markdown documentation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "andnp-searchkernel",
    "tree-sitter>=0.23.0",
    "tree-sitter-markdown>=0.3.2",
    "pyyaml>=6.0.2",
    "watchdog>=6.0.0",
    "fastapi>=0.115.0",
    "huey>=2.5.0",
    "uvicorn>=0.34.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "pyzmq>=26.2.0",
    "tomlkit>=0.13.0",
    "tenacity>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/mcp-markdown-ragdocs"
Documentation = "https://github.com/yourusername/mcp-markdown-ragdocs/tree/main/docs"
Repository = "https://github.com/yourusername/mcp-markdown-ragdocs.git"
Issues = "https://github.com/yourusername/mcp-markdown-ragdocs/issues"

[project.scripts]
mcp-markdown-ragdocs = "searchkernel.cli:main"

[dependency-groups]
dev = [
    "filelock>=3.0.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.14.10",
    "ty>=0.0.12",
    "import-linter>=2.0",
]

[tool.uv]
package = true

[tool.uv.sources]
andnp-searchkernel = { path = "../andnp-searchkernel", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["searchkernel"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-n 4 --dist worksteal"
markers = [
    "serial: marks tests that must run serially (not in parallel)",
    "unit: marks unit tests (fast, isolated)",
    "integration: marks integration tests (involve multiple components)",
    "e2e: marks end-to-end tests (full system tests)",
    "slow: marks slow tests (>5s, load models or process large datasets)",
    "real_embeddings: marks tests that require real embedding models (not fake deterministic embeddings)",
]

[tool.importlinter]
root_packages = ["searchkernel"]
default_mapping = "searchkernel"

[[tool.importlinter.contracts]]
name = "domain and ports are inward-only"
type = "forbidden"
source_modules = ["searchkernel.domain", "searchkernel.ports"]
forbidden_modules = [
    "searchkernel.adapters",
    "searchkernel.runtime",
    "searchkernel.storage",
    "searchkernel.indices",
    "searchkernel.search",
    "searchkernel.indexing",
    "searchkernel.daemon",
    "searchkernel.mcp",
    "searchkernel.worker",
    "searchkernel.coordination",
    "searchkernel.git",
]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "app-owned modules depend only on library public surface"
type = "forbidden"
source_modules = [
    "searchkernel.adapters.sources",
    "searchkernel.parsers",
    "searchkernel.daemon",
    "searchkernel.mcp",
    "searchkernel.worker",
    "searchkernel.coordination",
    "searchkernel.cli_utils",
    "searchkernel.indexing",
]
forbidden_modules = [
    "searchkernel.indices",
    "searchkernel.pipeline",
    "searchkernel.eval",
    "searchkernel.storage",
    "searchkernel.runtime",
    "searchkernel.compression",
    "searchkernel.adapters.embedding",
    "searchkernel.adapters.llm",
    "searchkernel.adapters.rerank",
    "searchkernel.adapters.stores",
    "searchkernel.adapters.cache",
    "searchkernel.chunking",
    "searchkernel.search",
]
ignore_imports = [
    "searchkernel.app.composition -> searchkernel.indices",
    "searchkernel.app.composition -> searchkernel.pipeline",
    "searchkernel.app.composition -> searchkernel.storage",
    "searchkernel.app.composition -> searchkernel.runtime",
    "searchkernel.app.composition -> searchkernel.adapters.embedding",
    "searchkernel.app.composition -> searchkernel.adapters.llm",
    "searchkernel.app.composition -> searchkernel.adapters.rerank",
    "searchkernel.app.composition -> searchkernel.adapters.stores",
    "searchkernel.app.composition -> searchkernel.adapters.cache",
    "searchkernel.app.composition -> searchkernel.chunking",
    "searchkernel.app.composition -> searchkernel.search",
    "searchkernel.app.runtime -> searchkernel.indices",
    "searchkernel.app.runtime -> searchkernel.pipeline",
    "searchkernel.app.runtime -> searchkernel.storage",
    "searchkernel.app.runtime -> searchkernel.runtime",
    "searchkernel.app.runtime -> searchkernel.adapters.embedding",
    "searchkernel.app.runtime -> searchkernel.adapters.llm",
    "searchkernel.app.runtime -> searchkernel.adapters.rerank",
    "searchkernel.app.runtime -> searchkernel.adapters.stores",
    "searchkernel.app.runtime -> searchkernel.adapters.cache",
    "searchkernel.app.runtime -> searchkernel.chunking",
    "searchkernel.app.runtime -> searchkernel.search",
]
