[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-markdown-ragdocs"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for semantic search over Markdown documentation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "andnp-searchkernel[faiss,markdown,ollama,pgvector]>=1.6.1",
    "tree-sitter>=0.23.0",
    "tree-sitter-markdown>=0.3.2",
    "pyyaml>=6.0.2",
    "watchdog>=6.0.0",
    "fastapi>=0.115.0",
    "huey>=2.5.0",
    "uvicorn>=0.34.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "mcp>=2.0.0",
    "pyzmq>=26.2.0",
    "tenacity>=9.0.0",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/mcp-markdown-ragdocs"
Documentation = "https://github.com/yourusername/mcp-markdown-ragdocs/tree/main/docs"
Repository = "https://github.com/yourusername/mcp-markdown-ragdocs.git"
Issues = "https://github.com/yourusername/mcp-markdown-ragdocs/issues"

[project.scripts]
mcp-markdown-ragdocs = "mcp_markdown_ragdocs.entrypoint:main"

[dependency-groups]
dev = [
    "filelock>=3.0.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.14.10",
    "ty>=0.0.12",
    "import-linter>=2.0",
    "llama-index-embeddings-huggingface>=0.6.0",
]

[tool.uv]
package = true

[tool.ruff.lint.per-file-ignores]
# cli.py's real imports intentionally follow a venv re-exec guard (which
# os.execve()s into the repo venv before anything else runs), so they can't
# be moved to the top of the file without breaking that bootstrap.
"mcp_markdown_ragdocs/cli.py" = ["E402"]

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.importlinter]
root_package = "mcp_markdown_ragdocs"

[[tool.importlinter.contracts]]
name = "Application search stays transport independent"
type = "forbidden"
source_modules = [
    "mcp_markdown_ragdocs.app.search",
]
forbidden_modules = [
    "mcp_markdown_ragdocs.cli",
    "mcp_markdown_ragdocs.daemon",
    "mcp_markdown_ragdocs.mcp",
    "mcp_markdown_ragdocs.server",
    "mcp_markdown_ragdocs.worker",
]

[[tool.importlinter.contracts]]
name = "Application services have no direct transport imports"
type = "forbidden"
source_modules = ["mcp_markdown_ragdocs.app.services"]
forbidden_modules = [
    "mcp_markdown_ragdocs.cli",
    "mcp_markdown_ragdocs.daemon",
    "mcp_markdown_ragdocs.mcp",
    "mcp_markdown_ragdocs.server",
    "mcp_markdown_ragdocs.worker",
]
allow_indirect_imports = true

[tool.hatch.build.targets.wheel]
packages = ["mcp_markdown_ragdocs"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-n 4 --dist worksteal"
markers = [
    "serial: marks tests that must run serially (not in parallel)",
    "unit: marks unit tests (fast, isolated)",
    "integration: marks integration tests (involve multiple components)",
    "e2e: marks end-to-end tests (full system tests)",
    "slow: marks slow tests (>5s, load models or process large datasets)",
    "real_embeddings: marks tests that require real embedding models (not fake deterministic embeddings)",
    "performance: marks hosted-runner-sensitive performance tests",
    "benchmark: marks benchmark tests",
]

# The app-side public searchkernel import boundary is checked by
# scripts/check_public_searchkernel_imports.py because import-linter does not
# inspect the externally installed searchkernel distribution.

[tool.pyright]
# This cache-warming script depends on llama-index's optional HuggingFace
# integration, which is intentionally absent from the standard development
# environment. CI executes it in the model-enabled test job.
exclude = [".venv", "scripts/download_test_models.py"]
